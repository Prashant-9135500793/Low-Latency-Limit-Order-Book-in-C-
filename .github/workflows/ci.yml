name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Select compiler
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: >-
          cmake -S . -B out/build/ci
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DLOB_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build out/build/ci --parallel 2
      - name: Test
        run: ctest --test-dir out/build/ci --output-on-failure

  asan-ubsan:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B out/build/asan
          -DCMAKE_BUILD_TYPE=Debug
          -DLOB_ENABLE_ASAN_UBSAN=ON
          -DLOB_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build out/build/asan --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir out/build/asan --output-on-failure

  thread-sanitizer:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: >-
          cmake -S . -B out/build/tsan
          -DCMAKE_BUILD_TYPE=Debug
          -DLOB_ENABLE_TSAN=ON
          -DLOB_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build out/build/tsan --parallel 2
      - name: Concurrency tests
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        # fork()+mmap integration is validated in the normal/ASan jobs;
        # this job targets in-process thread races specifically.
        run: >-
          ctest --test-dir out/build/tsan --output-on-failure
          -R 'test_(spsc|mpmc|partitioned_engine|randomized_matching)'
